# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Gradle Build

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
        - java: 26
          os: macos-latest
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest-26-arm64
    steps:
    # Keep LF line endings on Windows checkouts; checkstyle's LineEnding check requires LF
    - name: Disable git line ending conversion
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf

    - uses: actions/checkout@v7

    - name: Verify gradle wrapper
      uses: gradle/actions/wrapper-validation@v6
      if: matrix.java == '25'

    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v5
      with:
        java-version: ${{ matrix.java }}
        # Temurin publishes no JDK build for Windows on ARM64, so that leg uses Zulu
        distribution: ${{ matrix.distribution || 'temurin' }}

    - name: Grant execute permission for gradlew
      shell: bash
      run: chmod +x gradlew

    # Linux runners have no display, so the Swing tests run under xvfb there.
    # Windows and macOS runners have a desktop session and run Gradle directly.
    # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md
    - name: Build with Gradle
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          xvfb-run ./gradlew build jacocoTestReport -xsign -xpublish --warning-mode all
        else
          ./gradlew build jacocoTestReport -xsign -xpublish --warning-mode all
        fi

    - name: Submit coverage data to codecov
      uses: codecov/codecov-action@v7
      if: matrix.java == '25'
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        disable_search: true
        files: ./RSyntaxTextArea/build/reports/jacoco/test/jacocoTestReport.xml
        name: codecov
    name: build [${{ matrix.expander_leg }}]
    timeout-minutes: 150
